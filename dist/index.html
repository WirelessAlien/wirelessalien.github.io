        try {
          var savedTheme = window.localStorage.getItem("vite-ui-theme");
          if (savedTheme === "dark" || savedTheme === "light" || savedTheme === "system") {
            state.theme = savedTheme;
          }
        } catch (e) {}

        function applyTheme() {
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          if (state.theme === "system") {
            var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            root.classList.add(isDark ? "dark" : "light");
          } else {
            root.classList.add(state.theme);
          }
        }

        function toggleTheme() {
          var isCurrentlyDark = document.documentElement.classList.contains("dark");
          state.theme = isCurrentlyDark ? "light" : "dark";
          try {
            window.localStorage.setItem("vite-ui-theme", state.theme);
          } catch (e) {}
          applyTheme();
        }

        function parseHashRoute() {
          var hash = window.location.hash || "#/";
          if (hash.indexOf("#/") === 0) {
            return hash.slice(1);
          }
          if (hash === "#about") return "/about";
          if (hash === "#projects") return "/projects";
          return "/";
        }

        function navigate(path, scrollTarget) {
          state.isMenuOpen = false;
          state.route = path;
          if (window.location.hash !== "#" + path) {
            history.pushState(null, "", "#" + path);
          }
          render();
          if (scrollTarget) {
            setTimeout(function () {
              var el = document.getElementById(scrollTarget);
              if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 50);
          } else {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        }

        function scrollToSection(sectionId) {
          state.isMenuOpen = false;
          if (state.route !== "/" && state.route !== "/about" && state.route !== "/projects") {
            navigate("/", sectionId);
            return;
          }
          render();
          var el = document.getElementById(sectionId);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

                        '<div class="h-12 w-12 rounded-xl bg-[#24A1DE]/15 text-[#24A1DE] flex items-center justify-center shrink-0 group-hover:bg-[#24A1DE] group-hover:text-white transition-colors">' + icons.send + '</div>' +
                        '<div><h3 class="text-base font-bold text-on-surface">Telegram</h3><p class="text-sm text-on-surface-variant">@WirelessAlien</p></div>' +
                      '</div>' +
                      '<span class="text-primary/50 group-hover:text-primary transition-colors">' + icons.externalLink + '</span>' +
                    '</a>' +
                    '<a href="https://x.com/wirelessalien" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between p-5 rounded-2xl bg-surface-container-low border border-outline-variant/30 hover:border-primary/50 transition-all hover:bg-surface-container">' +
                      '<div class="flex items-center gap-4">' +
                        '<div class="h-12 w-12 rounded-xl bg-surface-variant text-on-surface-variant flex items-center justify-center shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors">' +
                          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' +
                        '</div>' +
                        '<div><h3 class="text-base font-bold text-on-surface">Twitter / X</h3><p class="text-sm text-on-surface-variant">@wirelessalien</p></div>' +
                      '</div>' +
                      '<span class="text-primary/50 group-hover:text-primary transition-colors">' + icons.externalLink + '</span>' +
                    '</a>' +
                    '<div class="pt-4">' +
                      '<a href="https://docs.google.com/forms/d/e/1FAIpQLSfKV_w-QIsmMZS6cP3f6UjuSii-Xy8XiIh1Mw4FEo_CTl4I9A/viewform" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center gap-2 p-3 text-xs text-on-surface-variant hover:text-primary rounded-xl hover:bg-surface-variant transition-colors">' +
                        '<span>Prefer the original Google Form?</span>' +
                        '<span class="font-semibold underline flex items-center gap-1">Open Form ' + icons.externalLink + '</span>' +
                      '</a>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }

        function renderFooter() {
          var currentYear = new Date().getFullYear();
          return (
            '<footer class="bg-surface-container-low border-t border-outline-variant/30 py-12 px-6">' +
              '<div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">' +
                '<button type="button" data-action="nav" data-path="/" class="flex items-center gap-3 group cursor-pointer">' +
                  '<div class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 border border-sky-500/20 shadow-sm p-1.5 transition-transform group-hover:scale-105">' +
                    '<img src="' + LOGO_SVG + '" alt="WirelessAlien" class="w-full h-full object-contain filter drop-shadow-[0_0_6px_rgba(56,189,248,0.6)]" />' +
                  '</div>' +
                  '<span class="text-xl font-bold tracking-tight text-on-background">WirelessAlien</span>' +
                '</button>' +
                '<div class="flex flex-wrap items-center justify-center gap-6 text-sm font-medium text-on-surface-variant">' +
                  '<button type="button" data-action="nav" data-path="/" class="hover:text-primary transition-colors cursor-pointer">Home</button>' +
                  '<button type="button" data-action="scroll" data-target="projects" class="hover:text-primary transition-colors cursor-pointer">Projects</button>' +
                  '<button type="button" data-action="nav" data-path="/contact" class="hover:text-primary transition-colors cursor-pointer">Contact</button>' +
                  '<button type="button" data-action="nav" data-path="/donate" class="hover:text-primary transition-colors cursor-pointer">Donate</button>' +
                '</div>' +
                '<div class="flex items-center gap-3">' +
                  '<a href="https://t.me/WirelessAlien" target="_blank" rel="noopener noreferrer" class="flex h-11 w-11 items-center justify-center rounded-full bg-secondary-container text-on-secondary-container hover:bg-[#24A1DE] hover:text-white transition-all" aria-label="Telegram">' + icons.send + '</a>' +
                  '<a href="https://x.com/wirelessalien" target="_blank" rel="noopener noreferrer" class="flex h-11 w-11 items-center justify-center rounded-full bg-secondary-container text-on-secondary-container hover:bg-primary hover:text-on-primary transition-all" aria-label="Twitter/X">' + icons.twitter + '</a>' +
                  '<a href="https://github.com/WirelessAlien" target="_blank" rel="noopener noreferrer" class="flex h-11 w-11 items-center justify-center rounded-full bg-secondary-container text-on-secondary-container hover:bg-primary hover:text-on-primary transition-all" aria-label="GitHub">' + icons.github + '</a>' +
                  '<a href="mailto:dev.abhilash.s@gmail.com" class="flex h-11 w-11 items-center justify-center rounded-full bg-secondary-container text-on-secondary-container hover:bg-primary hover:text-on-primary transition-all" aria-label="Email">' + icons.mail + '</a>' +
                '</div>' +
              '</div>' +
              '<div class="max-w-7xl mx-auto mt-8 pt-6 border-t border-outline-variant/20 text-center">' +
                '<p class="text-sm text-on-surface-variant">&copy; ' + currentYear + ' WirelessAlien. All rights reserved.</p>' +
              '</div>' +
            '</footer>'
          );
        }

        function render() {
          var rootEl = document.getElementById("root");
          if (!rootEl) return;

          var pageHtml = "";
          if (state.route === "/donate") {
            pageHtml = renderDonate();
          } else if (state.route === "/contact") {
            pageHtml = renderContactPage();
          } else if (state.route.indexOf("/project/") === 0) {
            var projectId = state.route.replace("/project/", "");
            pageHtml = renderProjectDetails(projectId);
          } else {
            pageHtml = renderHome();
          }

          rootEl.innerHTML =
            '<div class="min-h-screen flex flex-col bg-surface font-sans text-on-background selection:bg-primary-container selection:text-on-primary-container">' +
              renderTopAppBar() +
              '<div class="flex-1">' + pageHtml + '</div>' +
              renderFooter() +
            '</div>';

          var formEl = document.getElementById("contact-form");
          if (formEl) {
            formEl.addEventListener("input", function (e) {
              var target = e.target;
              if (target && target.name && state.formData.hasOwnProperty(target.name)) {
                state.formData[target.name] = target.value;
              }
            });
            formEl.addEventListener("submit", function (e) {
              e.preventDefault();
              if (!state.formData.name.trim() || !state.formData.message.trim()) {
                state.formStatus = "error";
                state.formError = "Please fill in your name and message.";
                render();
                return;
              }
              state.formStatus = "submitting";
              state.formError = "";
              render();

              var formBody = new URLSearchParams();
              formBody.append(ENTRY_IDS.name, state.formData.name);
              formBody.append(ENTRY_IDS.address, state.formData.address);
              formBody.append(ENTRY_IDS.phone, state.formData.phone);
              formBody.append(ENTRY_IDS.message, state.formData.message);

              fetch(GOOGLE_FORM_ACTION_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formBody.toString()
              }).then(function () {
                state.formStatus = "success";
                state.formData = { name: "", address: "", phone: "", message: "" };
                render();
              }).catch(function () {
                state.formStatus = "error";
                state.formError = "There was an issue sending your message. Please try again or reach out directly via email or Telegram.";
                render();
              });
            });
          }
        }

        document.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-action]");
          if (!btn) return;
          var action = btn.getAttribute("data-action");
          if (action === "nav") {
            e.preventDefault();
            navigate(btn.getAttribute("data-path") || "/");
          } else if (action === "scroll") {
            e.preventDefault();
            scrollToSection(btn.getAttribute("data-target") || "projects");
          } else if (action === "toggle-theme") {
            e.preventDefault();
            toggleTheme();
          } else if (action === "toggle-menu") {
            e.preventDefault();
            state.isMenuOpen = !state.isMenuOpen;
            render();
          } else if (action === "reset-form") {
            e.preventDefault();
            state.formStatus = "idle";
            state.formError = "";
            render();
          }
        });

        window.addEventListener("popstate", function () {
          state.route = parseHashRoute();
          render();
          if (state.route === "/about") {
            setTimeout(function () { scrollToSection("about"); }, 50);
          } else if (state.route === "/projects") {
            setTimeout(function () { scrollToSection("projects"); }, 50);
          }
        });

        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
            if (state.theme === "system") {
              applyTheme();
            }
          });
        }

        applyTheme();
        state.route = parseHashRoute();
        render();
        if (state.route === "/about") {
          setTimeout(function () { scrollToSection("about"); }, 60);
        } else if (state.route === "/projects") {
          setTimeout(function () { scrollToSection("projects"); }, 60);
        }
      })();
    </script>
  </body>
</html>
